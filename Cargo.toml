[workspace]
members = [".", "crates/sli", "crates/slc", "crates/safelisp-derive"]
default-members = [".", "crates/sli", "crates/slc"]
resolver = "2"

[package]
name = "safelisp"
version = "0.1.0"
edition = "2021"
authors = ["Christopher Armstrong <radix@twistedmatrix.com>"]

[features]
default = ["derive"]
# Derive macros for converting Rust structs/enums to and from Safelisp values.
derive = ["dep:safelisp-derive"]

[dependencies]
serde = "1.0"
serde_derive = "1.0"
unescape = "0.1"
gc-arena = "0.6"
blake3 = {version = "1", default-features = false}
rand_chacha = {version = "0.9", default-features = false}
rand_core = {version = "0.9", default-features = false}
safelisp-derive = {path = "crates/safelisp-derive", optional = true}

[dev-dependencies]
pretty_assertions = "1.2.1"
rstest = "0.26.1"
